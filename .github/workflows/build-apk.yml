name: Compilar APK MiMusic Pro

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Manifest y MainActivity con permisos de Internet
      run: |
        mkdir -p app/src/main/java/com/mimusic/pro
        mkdir -p app/src/main
        curl -s -L "https://ais-dev-kjgi5aqtckfdpxxprpvlgr-64441565370.us-east1.run.app/AndroidManifest.xml.txt" -o app/src/main/AndroidManifest.xml
        curl -s -L "https://ais-dev-kjgi5aqtckfdpxxprpvlgr-64441565370.us-east1.run.app/MainActivity.kt.txt" -o app/src/main/java/com/mimusic/pro/MainActivity.kt

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Configurar Gradle 8.10.2 Oficial
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Compilar APK Debug con Gradle
      run: gradle :app:assembleDebug --stacktrace

    - name: Subir APK compilado como artefacto descargable
      uses: actions/upload-artifact@v4
      with:
        name: MiMusicPro-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
